<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Shining Star</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="site-wrapper">
        
        <!-- EN-TÊTE DU SITE -->
        <header class="top-header">
            <img src="shiningv.png" alt="Logo Gauche" class="header-logo">
            <h1 class="header-title">SHINING STAR</h1>
            <img src="shiningv.png" alt="Logo Droite" class="header-logo">
        </header>

        <main class="main-content">

            <!-- CARTE DU FORMULAIRE -->
            <section class="form-card">
                <div class="form-header">
                    <h2>Formulaire d'Inscription</h2>
                    <p>Choisissez l'établissement souhaité puis remplissez le formulaire pour valider votre demande sur WhatsApp.</p>
                </div>

                <!-- SELECTEUR D'ONGLETS -->
                <div class="tab-buttons">
                    <button type="button" class="tab-btn active" id="tab-center-btn" onclick="switchTab('center')">Shining Star Center</button>
                    <button type="button" class="tab-btn" id="tab-school-btn" onclick="switchTab('school')">Shining Star School</button>
                </div>

                <!-- 1. FORMULAIRE SHINING STAR CENTER -->
                <form id="centerForm" class="registration-form active-form">

                    <!-- INFORMATIONS PERSONNELLES -->
                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="fullName">Nom & Prénom de l'apprenant *</label>
                            <input type="text" id="fullName" placeholder="Ex: Jean Dupont" required>
                        </div>

                        <div class="form-group">
                            <label for="studentPhone">Numéro Téléphone / WhatsApp *</label>
                            <input type="tel" id="studentPhone" placeholder="Ex: +242 06 000 00 00" required>
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="status">Statut de l'apprenant *</label>
                            <select id="status" required>
                                <option value="" disabled selected>Sélectionnez votre profil</option>
                                <option value="Élève (Primaire / Collège / Lycée)">Élève (Primaire / Collège / Lycée)</option>
                                <option value="Étudiant">Étudiant</option>
                                <option value="Parent d'élève">Parent d'élève</option>
                                <option value="Travailleur / Professionnel">Travailleur / Professionnel</option>
                                <option value="Autre">Autre</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="parentPhone">Téléphone Parent / Tuteur (Si mineur)</label>
                            <input type="tel" id="parentPhone" placeholder="Ex: +242 05 000 00 00">
                        </div>
                    </div>

                    <!-- CHOIX DE LA FORMATION -->
                    <div class="form-group">
                        <label for="category">Domaine ou Type d'encadrement *</label>
                        <select id="category" required onchange="updateCenterOptions()">
                            <option value="" disabled selected>Choisissez le domaine d'inscription</option>
                            <option value="Formations Professionnelles en Métiers">Formations Professionnelles en Métiers</option>
                            <option value="Informatique & Bureautique">Informatique & Bureautique</option>
                            <option value="Langues Étrangères">Langues Étrangères</option>
                            <option value="Alphabétisation">Alphabétisation</option>
                            <option value="Scolaire - Primaire">Encadrement Scolaire : Primaire</option>
                            <option value="Scolaire - Collège">Encadrement Scolaire : Collège</option>
                            <option value="Scolaire - Lycée Général">Encadrement Scolaire : Lycée Général</option>
                            <option value="Scolaire - Lycée Technique">Encadrement Scolaire : Lycée Technique</option>
                            <option value="Préparation aux Concours">Préparation aux Concours</option>
                            <option value="Examens pour l'Étranger">Examens pour Étudier à l'Étranger</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="specificChoice">Filière, Classe ou Matière spécifique *</label>
                        <select id="specificChoice" required>
                            <option value="" disabled selected>Veuillez d'abord choisir le domaine ci-dessus</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="schedule">Disponibilité / Créneau souhaité</label>
                        <select id="schedule">
                            <option value="Matin">Matin</option>
                            <option value="Après-midi">Après-midi</option>
                            <option value="Soir (Cours du soir)">Soir (Cours du soir)</option>
                            <option value="Week-end">Week-end</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="notes">Message ou précision complémentaire</label>
                        <textarea id="notes" rows="3" placeholder="Avez-vous des besoins spécifiques ou des questions ?"></textarea>
                    </div>

                    <button type="submit" class="btn-whatsapp-submit btn-center">
                        <span>📲 S'inscrire au Centre via WhatsApp</span>
                    </button>

                </form>

                <!-- 2. FORMULAIRE SHINING STAR SCHOOL -->
                <form id="schoolForm" class="registration-form">

                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="schoolStudentName">Nom & Prénom de l'élève *</label>
                            <input type="text" id="schoolStudentName" placeholder="Ex: Paul Malonga" required>
                        </div>

                        <div class="form-group">
                            <label for="schoolParentPhone">Téléphone du Parent / Tuteur *</label>
                            <input type="tel" id="schoolParentPhone" placeholder="Ex: +242 05 616 41 62" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="schoolCycle">Cycle d'études *</label>
                        <select id="schoolCycle" required onchange="updateSchoolClasses()">
                            <option value="" disabled selected>Sélectionnez le cycle</option>
                            <option value="Primaire">Primaire</option>
                            <option value="Collège">Collège</option>
                            <option value="Lycée">Lycée</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="schoolClass">Classe souhaitée *</label>
                        <select id="schoolClass" required>
                            <option value="" disabled selected>Choisissez d'abord un cycle ci-dessus</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="schoolNotes">Message ou précision complémentaire</label>
                        <textarea id="schoolNotes" rows="3" placeholder="Informations complémentaires sur l'élève..."></textarea>
                    </div>

                    <button type="submit" class="btn-whatsapp-submit btn-school">
                        <span>📲 S'inscrire à l'École via WhatsApp</span>
                    </button>

                </form>

            </section>

        </main>

    </div>

    <!-- SCRIPT DE GESTION DES ONGLETS, SÉLECTION DYNAMIQUE ET REDIRECTION WHATSAPP -->
    <script>
        // Numéros WhatsApp officiels
        const WHATSAPP_CENTER = "242069855159";
        const WHATSAPP_SCHOOL = "242056164162";

        // Gestion du changement d'onglets
        function switchTab(type) {
            const btnCenter = document.getElementById('tab-center-btn');
            const btnSchool = document.getElementById('tab-school-btn');
            const formCenter = document.getElementById('centerForm');
            const formSchool = document.getElementById('schoolForm');

            if (type === 'center') {
                btnCenter.classList.add('active');
                btnSchool.classList.remove('active');
                formCenter.classList.add('active-form');
                formSchool.classList.remove('active-form');
            } else {
                btnSchool.classList.add('active');
                btnCenter.classList.remove('active');
                formSchool.classList.add('active-form');
                formCenter.classList.remove('active-form');
            }
        }

        // Mettre à jour les options dynamiques du Center
        function updateCenterOptions() {
            const category = document.getElementById('category').value;
            const subSelect = document.getElementById('specificChoice');
            subSelect.innerHTML = '<option value="" disabled selected>Sélectionnez votre option</option>';

            let options = [];

            switch (category) {
                case 'Formations Professionnelles en Métiers':
                    options = [
                        'QHSE (Qualité, Hygiène, Sécurité, Environnement)',
                        'Opérateur Production Pétrolière',
                        'Assistanat de Direction',
                        'Gestion d\'Entreprise',
                        'Gestion des Ressources Humaines (GRH)',
                        'Pédagogie Générale',
                        'Compliance Officer',
                        'Comptabilité & Gestion de Caisse'
                    ];
                    break;
                case 'Informatique & Bureautique':
                    options = ['Microsoft Word', 'Microsoft Excel', 'Microsoft PowerPoint', 'Microsoft Access', 'Pack Bureautique Complet'];
                    break;
                case 'Langues Étrangères':
                    options = ['Anglais Standard / Business', 'Espagnol', 'Chinois', 'Italien', 'Portugais', 'Français'];
                    break;
                case 'Alphabétisation':
                    options = ['Programme Adulte', 'Programme Mineur'];
                    break;
                case 'Scolaire - Primaire':
                    options = ['CE1', 'CE2', 'CM1', 'CM2', 'Remise à Niveau Primaire'];
                    break;
                case 'Scolaire - Collège':
                    options = ['6ème', '5ème', '4ème', '3ème (Préparation BEPC)', 'Remise à Niveau Collège'];
                    break;
                case 'Scolaire - Lycée Général':
                    options = ['Seconde A/C/D', 'Première A/C/D', 'Terminale A/C/D (Préparation BAC)', 'Philosophie / Maths / PC / SVT'];
                    break;
                case 'Scolaire - Lycée Technique':
                    options = ['Série G (Tertiaire)', 'Série BG', 'Série F (Industrielle)', 'Série R', 'Série H', 'Comptabilité / Électrotechnique / Mécanique / Dessin Ind.'];
                    break;
                case 'Préparation aux Concours':
                    options = ['Concours E.N.I', 'Concours E.N.M.A', 'Concours ENSP', 'Concours ENS', 'Concours FSSA', 'Concours ENSAF'];
                    break;
                case 'Examens pour l\'Étranger':
                    options = ['IELTS', 'TOEFL', 'TOEIC', 'SAT'];
                    break;
            }

            options.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt;
                el.textContent = opt;
                subSelect.appendChild(el);
            });
        }

        // Mettre à jour les classes dynamiques de l'École
        function updateSchoolClasses() {
            const cycle = document.getElementById('schoolCycle').value;
            const classSelect = document.getElementById('schoolClass');
            classSelect.innerHTML = '<option value="" disabled selected>Sélectionnez la classe</option>';

            let classes = [];
            if (cycle === 'Primaire') {
                classes = ['CP', 'CE1', 'CE2', 'CM1', 'CM2'];
            } else if (cycle === 'Collège') {
                classes = ['6ème', '5ème', '4ème', '3ème'];
            } else if (cycle === 'Lycée') {
                classes = ['Seconde', 'Première', 'Terminale'];
            }

            classes.forEach(cls => {
                const el = document.createElement('option');
                el.value = cls;
                el.textContent = cls;
                classSelect.appendChild(el);
            });
        }

        // Soumission Formulaire Centre (+242 06 985 51 59)
        document.getElementById('centerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const studentPhone = document.getElementById('studentPhone').value.trim();
            const status = document.getElementById('status').value;
            const parentPhone = document.getElementById('parentPhone').value.trim() || 'Non renseigné';
            const category = document.getElementById('category').value;
            const specificChoice = document.getElementById('specificChoice').value;
            const schedule = document.getElementById('schedule').value;
            const notes = document.getElementById('notes').value.trim() || 'Aucune remarque';

            const message = `*DEMANDE D'INSCRIPTION - SHINING STAR CENTER*\n\n` +
                `👤 *Apprenant :* ${fullName}\n` +
                `📱 *Téléphone :* ${studentPhone}\n` +
                `🎓 *Statut :* ${status}\n` +
                `👨‍👩‍👦 *Contact Parent/Tuteur :* ${parentPhone}\n\n` +
                `📚 *Domaine :* ${category}\n` +
                `🎯 *Option / Classe :* ${specificChoice}\n` +
                `⏰ *Créneau souhaité :* ${schedule}\n` +
                `💬 *Note/Précision :* ${notes}`;

            window.open(`https://wa.me/${WHATSAPP_CENTER}?text=${encodeURIComponent(message)}`, '_blank');
        });

        // Soumission Formulaire École (+242 05 616 41 62)
        document.getElementById('schoolForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const studentName = document.getElementById('schoolStudentName').value.trim();
            const parentPhone = document.getElementById('schoolParentPhone').value.trim();
            const cycle = document.getElementById('schoolCycle').value;
            const schoolClass = document.getElementById('schoolClass').value;
            const notes = document.getElementById('schoolNotes').value.trim() || 'Aucune remarque';

            const message = `*DEMANDE D'INSCRIPTION - SHINING STAR SCHOOL*\n\n` +
                `🎓 *Élève :* ${studentName}\n` +
                `📞 *Téléphone Parent/Tuteur :* ${parentPhone}\n` +
                `🏫 *Cycle d'études :* ${cycle}\n` +
                `📖 *Classe sollicitée :* ${schoolClass}\n` +
                `💬 *Note/Précision :* ${notes}`;

            window.open(`https://wa.me/${WHATSAPP_SCHOOL}?text=${encodeURIComponent(message)}`, '_blank');
        });
    </script>

</body>
</html>
